{{ define "main" }}
<section class="hero-section" style="margin: 4rem 0; padding: 3rem 2rem; background: linear-gradient(135deg, #f5f1e6 0%, #e8e4d9 100%); border-radius: 12px;">
  <div class="container" style="max-width: 800px; margin: 0 auto;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1.5rem; color: #4a7c59;">
      {{ .Title }}
    </h1>
    <p style="font-size: 1.25rem; line-height: 1.8; color: #666; margin-bottom: 2rem;">
      {{ .Description }}
    </p>
    {{ with .Content }}
    {{ . | markdownify }}
    {{ end }}
    <div style="margin-top: 3rem;">
      <a href="{{ .Site.Params.contribute_url }}" 
         class="btn btn-primary" 
         style="display: inline-block; background: #4a7c59; color: white; padding: 0.75rem 2rem; text-decoration: none; border-radius: 6px;">
        Contribute to the Oracle
      </a>
    </div>
  </div>
</section>
{{ end }}
